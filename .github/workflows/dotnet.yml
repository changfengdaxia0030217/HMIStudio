name: .NET 10 build

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: hmistudio-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build React/TypeScript frontend
        working-directory: src/HMI.Web
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore HMIStudio.sln
      - name: Build
        run: dotnet build HMIStudio.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test HMIStudio.sln --configuration Release --no-build --no-restore
      - name: Runtime API smoke test
        shell: pwsh
        run: |
          $env:HMISTUDIO_URLS = "http://127.0.0.1:5081"
          $server = Start-Process dotnet -ArgumentList @("run", "--no-build", "--project", "src/HMI.Server", "--configuration", "Release") -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\hmistudio-server.log" -RedirectStandardError "$env:RUNNER_TEMP\hmistudio-server-error.log"
          try {
            $health = $null
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Seconds 2
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:5081/api/health" -TimeoutSec 3
                break
              } catch {
                if ($server.HasExited) { break }
              }
            }
            if ($null -eq $health -or $health.status -ne "ok") {
              Get-Content "$env:RUNNER_TEMP\hmistudio-server.log" -ErrorAction SilentlyContinue
              Get-Content "$env:RUNNER_TEMP\hmistudio-server-error.log" -ErrorAction SilentlyContinue
              throw "HMIStudio runtime health endpoint did not become ready"
            }
            $variables = Invoke-RestMethod "http://127.0.0.1:5081/api/variables" -TimeoutSec 5
            if ($variables.Count -lt 1) { throw "HMIStudio runtime returned no variables" }
            $readonlyPlcVariable = Invoke-RestMethod "http://127.0.0.1:5081/api/variables/line.speed" -TimeoutSec 5
            if ($readonlyPlcVariable.writable -ne $false) { throw "HMIStudio demo PLC speed variable must be exposed as readonly" }
            $mockValueBody = @{ protocol = "MOCK"; address = "line.speed"; value = 56.25 } | ConvertTo-Json
            $mockValueReceipt = Invoke-RestMethod -Uri "http://127.0.0.1:5081/api/runtime/mock-values" -Method Post -ContentType "application/json" -Body $mockValueBody -TimeoutSec 5
            if (-not $mockValueReceipt.ok) { throw "HMIStudio rejected a valid simulated PLC value" }
            $unknownMockAddressRejected = $false
            try {
              $unknownMockBody = @{ protocol = "MOCK"; address = "unmapped.address"; value = 10 } | ConvertTo-Json
              Invoke-RestMethod -Uri "http://127.0.0.1:5081/api/runtime/mock-values" -Method Post -ContentType "application/json" -Body $unknownMockBody -TimeoutSec 5 | Out-Null
            } catch {
              if ($_.Exception.Response.StatusCode.value__ -eq 400) { $unknownMockAddressRejected = $true }
            }
            if (-not $unknownMockAddressRejected) { throw "HMIStudio accepted an unmapped simulated PLC address" }
            $invalidMockTypeRejected = $false
            try {
              $invalidMockTypeBody = @{ protocol = "MOCK"; address = "line.speed"; value = "fast" } | ConvertTo-Json
              Invoke-RestMethod -Uri "http://127.0.0.1:5081/api/runtime/mock-values" -Method Post -ContentType "application/json" -Body $invalidMockTypeBody -TimeoutSec 5 | Out-Null
            } catch {
              if ($_.Exception.Response.StatusCode.value__ -eq 400) { $invalidMockTypeRejected = $true }
            }
            if (-not $invalidMockTypeRejected) { throw "HMIStudio accepted a string for a float PLC variable" }
            $invalidMockRangeRejected = $false
            try {
              $invalidMockRangeBody = @{ protocol = "MOCK"; address = "line.speed"; value = 101 } | ConvertTo-Json
              Invoke-RestMethod -Uri "http://127.0.0.1:5081/api/runtime/mock-values" -Method Post -ContentType "application/json" -Body $invalidMockRangeBody -TimeoutSec 5 | Out-Null
            } catch {
              if ($_.Exception.Response.StatusCode.value__ -eq 400) { $invalidMockRangeRejected = $true }
            }
            if (-not $invalidMockRangeRejected) { throw "HMIStudio accepted an out-of-range simulated PLC value" }
            $drivers = @(Invoke-RestMethod "http://127.0.0.1:5081/api/drivers" -TimeoutSec 5)
            if ($drivers.Count -lt 1) { throw "HMIStudio runtime returned no configured drivers" }
            if ($drivers[0].variableCount -lt 1 -or $drivers[0].variables.Count -lt 1) { throw "HMIStudio driver diagnostics returned no mapped variables" }
            $backupPath = Join-Path $env:RUNNER_TEMP "hmistudio-backup-smoke.zip"
            Invoke-WebRequest "http://127.0.0.1:5081/api/backup" -OutFile $backupPath -TimeoutSec 15
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $backupArchive = [System.IO.Compression.ZipFile]::OpenRead($backupPath)
            try {
              $backupEntries = @($backupArchive.Entries | ForEach-Object { $_.FullName })
              if ($backupEntries -notcontains "manifest.json") { throw "Backup ZIP has no manifest" }
              if (-not ($backupEntries | Where-Object { $_ -like "project/*.hmijob" })) { throw "Backup ZIP has no project JSON" }
              if ($backupEntries -notcontains "data/alarms.sqlite") { throw "Backup ZIP has no SQLite alarm history" }
            } finally { $backupArchive.Dispose() }
            $backupInspection = Invoke-RestMethod -Uri "http://127.0.0.1:5081/api/backup/inspect" -Method Post -Form @{ file = Get-Item $backupPath } -TimeoutSec 15
            if (-not $backupInspection.ok -or -not $backupInspection.projectValid -or -not $backupInspection.alarmHistoryIncluded -or $backupInspection.alarmDatabaseIntegrity -ne "ok") {
              throw "HMIStudio backup inspection did not validate the exported archive"
            }
            $invalidBackupPath = Join-Path $env:RUNNER_TEMP "hmistudio-invalid-backup.zip"
            [System.IO.File]::WriteAllText($invalidBackupPath, "not a ZIP archive")
            $invalidBackupRejected = $false
            try {
              Invoke-RestMethod -Uri "http://127.0.0.1:5081/api/backup/inspect" -Method Post -Form @{ file = Get-Item $invalidBackupPath } -TimeoutSec 10 | Out-Null
            } catch {
              if ($_.Exception.Response.StatusCode.value__ -eq 400) { $invalidBackupRejected = $true }
            }
            if (-not $invalidBackupRejected) { throw "HMIStudio accepted an invalid backup archive" }
            $mismatchBackupPath = Join-Path $env:RUNNER_TEMP "hmistudio-mismatched-manifest.zip"
            $mismatchArchive = [System.IO.Compression.ZipFile]::Open($mismatchBackupPath, [System.IO.Compression.ZipArchiveMode]::Create)
            try {
              $manifestEntry = $mismatchArchive.CreateEntry("manifest.json")
              $manifestWriter = [System.IO.StreamWriter]::new($manifestEntry.Open())
              try { $manifestWriter.Write('{"product":"HMIStudio","backupFormatVersion":1,"projectFile":"different.hmijob","alarmHistoryIncluded":false}') } finally { $manifestWriter.Dispose() }
              $projectEntry = $mismatchArchive.CreateEntry("project/demo.hmijob")
              $projectWriter = [System.IO.StreamWriter]::new($projectEntry.Open())
              try { $projectWriter.Write("{}") } finally { $projectWriter.Dispose() }
            } finally { $mismatchArchive.Dispose() }
            $mismatchedManifestRejected = $false
            try {
              Invoke-RestMethod -Uri "http://127.0.0.1:5081/api/backup/inspect" -Method Post -Form @{ file = Get-Item $mismatchBackupPath } -TimeoutSec 10 | Out-Null
            } catch {
              if ($_.Exception.Response.StatusCode.value__ -eq 400) { $mismatchedManifestRejected = $true }
            }
            if (-not $mismatchedManifestRejected) { throw "HMIStudio accepted a backup whose manifest disagrees with its files" }
            $malformedVersionPath = Join-Path $env:RUNNER_TEMP "hmistudio-malformed-version.zip"
            $malformedVersionArchive = [System.IO.Compression.ZipFile]::Open($malformedVersionPath, [System.IO.Compression.ZipArchiveMode]::Create)
            try {
              $manifestEntry = $malformedVersionArchive.CreateEntry("manifest.json")
              $manifestWriter = [System.IO.StreamWriter]::new($manifestEntry.Open())
              try { $manifestWriter.Write('{"product":"HMIStudio","backupFormatVersion":2147483648,"projectFile":"demo.hmijob","alarmHistoryIncluded":false}') } finally { $manifestWriter.Dispose() }
              $projectEntry = $malformedVersionArchive.CreateEntry("project/demo.hmijob")
              $projectWriter = [System.IO.StreamWriter]::new($projectEntry.Open())
              try { $projectWriter.Write("{}") } finally { $projectWriter.Dispose() }
            } finally { $malformedVersionArchive.Dispose() }
            $malformedVersionRejected = $false
            try {
              Invoke-RestMethod -Uri "http://127.0.0.1:5081/api/backup/inspect" -Method Post -Form @{ file = Get-Item $malformedVersionPath } -TimeoutSec 10 | Out-Null
            } catch {
              if ($_.Exception.Response.StatusCode.value__ -eq 400) { $malformedVersionRejected = $true }
            }
            if (-not $malformedVersionRejected) { throw "HMIStudio did not reject an out-of-range backup format version with HTTP 400" }
            $projectSummary = Invoke-RestMethod "http://127.0.0.1:5081/api/project" -TimeoutSec 5
            $projectValidation = Invoke-RestMethod "http://127.0.0.1:5081/api/project/validate" -TimeoutSec 5
            if (-not $projectValidation.ok -or $projectValidation.errors.Count -gt 0) { throw "HMIStudio project validation failed: $($projectValidation.errors -join '; ')" }
            $screenSummaries = @(Invoke-RestMethod "http://127.0.0.1:5081/api/screens" -TimeoutSec 5)
            if (-not ($screenSummaries | Where-Object { $_.id -eq $projectSummary.startScreenId })) { throw "HMIStudio project start screen does not exist in the screen list" }
            $newScreenId = "ci-screen-" + [guid]::NewGuid().ToString("N")
            $createScreenBody = @{ id = $newScreenId; title = "CI screen creation"; background = "#111827"; width = 1280; height = 720 } | ConvertTo-Json
            $createdScreen = Invoke-RestMethod -Uri "http://127.0.0.1:5081/api/screens" -Method Post -ContentType "application/json" -Body $createScreenBody -TimeoutSec 5
            if (-not $createdScreen.ok -or $createdScreen.screenId -ne $newScreenId) { throw "HMIStudio create-screen API returned failure" }
            $createdScreenDetails = Invoke-RestMethod "http://127.0.0.1:5081/api/screens/$newScreenId" -TimeoutSec 5
            if ($createdScreenDetails.title -ne "CI screen creation" -or $createdScreenDetails.controls.Count -ne 0) { throw "HMIStudio created screen did not round-trip correctly" }
            $setStartBody = @{ screenId = $newScreenId } | ConvertTo-Json
            $setStartReceipt = Invoke-RestMethod -Uri "http://127.0.0.1:5081/api/project/start-screen" -Method Put -ContentType "application/json" -Body $setStartBody -TimeoutSec 5
            if (-not $setStartReceipt.ok -or $setStartReceipt.startScreenId -ne $newScreenId) { throw "HMIStudio set-start-screen API returned failure" }
            $startScreenDeleteRejected = $false
            try {
              Invoke-RestMethod -Uri "http://127.0.0.1:5081/api/screens/$newScreenId" -Method Delete -TimeoutSec 5 | Out-Null
            } catch {
              if ($_.Exception.Response.StatusCode.value__ -eq 400) { $startScreenDeleteRejected = $true }
            }
            if (-not $startScreenDeleteRejected) { throw "HMIStudio allowed deleting the active start screen" }
            $projectAfterStartChange = Invoke-RestMethod "http://127.0.0.1:5081/api/project" -TimeoutSec 5
            if ($projectAfterStartChange.startScreenId -ne $newScreenId) { throw "HMIStudio project did not persist its new start screen" }
            $restoreStartBody = @{ screenId = $projectSummary.startScreenId } | ConvertTo-Json
            $restoreStartReceipt = Invoke-RestMethod -Uri "http://127.0.0.1:5081/api/project/start-screen" -Method Put -ContentType "application/json" -Body $restoreStartBody -TimeoutSec 5
            if (-not $restoreStartReceipt.ok) { throw "HMIStudio failed to restore the original start screen during smoke test" }
            $deleteScreenReceipt = Invoke-RestMethod -Uri "http://127.0.0.1:5081/api/screens/$newScreenId" -Method Delete -TimeoutSec 5
            if (-not $deleteScreenReceipt.ok -or -not $deleteScreenReceipt.deleted) { throw "HMIStudio delete-screen API returned failure" }
            $screensAfterDelete = @(Invoke-RestMethod "http://127.0.0.1:5081/api/screens" -TimeoutSec 5)
            $deletedStillListed = @($screensAfterDelete | Where-Object { $_.id -eq $newScreenId })
            if ($deletedStillListed.Count -gt 0) { throw "HMIStudio deleted screen is still listed" }
            $remainingScreens = @(Invoke-RestMethod "http://127.0.0.1:5081/api/screens" -TimeoutSec 5)
            if ($remainingScreens.Count -eq 1) {
              $lastScreenId = $remainingScreens[0].id
              $lastScreenDeleteRejected = $false
              try {
                Invoke-RestMethod -Uri "http://127.0.0.1:5081/api/screens/$lastScreenId" -Method Delete -TimeoutSec 5 | Out-Null
              } catch {
                if ($_.Exception.Response.StatusCode.value__ -eq 400) { $lastScreenDeleteRejected = $true }
              }
              if (-not $lastScreenDeleteRejected) { throw "HMIStudio allowed deleting the final project screen" }
            }
            $writeBody = @{ value = 61.5; requestId = "ci-write-validation" } | ConvertTo-Json
            $writeReceipt = Invoke-RestMethod -Uri "http://127.0.0.1:5081/api/variables/line.targetSpeed/write" -Method Post -ContentType "application/json" -Body $writeBody -TimeoutSec 5
            if (-not $writeReceipt.ok) { throw "HMIStudio variable write API returned failure" }
            $writtenVariable = Invoke-RestMethod "http://127.0.0.1:5081/api/variables/line.targetSpeed" -TimeoutSec 5
            if ([double]$writtenVariable.value -ne 61.5) { throw "HMIStudio variable write did not update the live value" }
            $screen = Invoke-RestMethod "http://127.0.0.1:5081/api/screens/main" -TimeoutSec 5
            if ($screen.controls.Count -lt 8) { throw "Demo screen is missing interactive simulator controls" }
            $runToggle = $screen.controls | Where-Object { $_.id -eq "run-toggle" } | Select-Object -First 1
            if (-not $runToggle -or $runToggle.properties.writeVarId.source.value -ne "line.running") { throw "Demo run button is not bound to line.running" }
            $targetInput = $screen.controls | Where-Object { $_.id -eq "target-speed-input" } | Select-Object -First 1
            if (-not $targetInput -or $targetInput.properties.text.source.varId -ne "line.targetSpeed") { throw "Demo numeric input is not bound to line.targetSpeed" }
            $alarmWriteBody = @{ value = 95; requestId = "ci-alarm-trigger" } | ConvertTo-Json
            $alarmWrite = Invoke-RestMethod -Uri "http://127.0.0.1:5081/api/variables/line.targetSpeed/write" -Method Post -ContentType "application/json" -Body $alarmWriteBody -TimeoutSec 5
            if (-not $alarmWrite.ok) { throw "HMIStudio alarm trigger variable write failed" }
            $activeAlarms = @()
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Seconds 1
              $activeAlarms = @(Invoke-RestMethod "http://127.0.0.1:5081/api/alarms/active" -TimeoutSec 5)
              if ($activeAlarms.Count -gt 0) { break }
            }
            $activeAlarm = $activeAlarms | Where-Object { $_.ruleId -eq "target-speed-high" } | Select-Object -First 1
            if (-not $activeAlarm) { throw "Alarm engine did not trigger target-speed-high" }
            $alarmId = $activeAlarm.alarmId
            $acknowledged = Invoke-RestMethod -Uri "http://127.0.0.1:5081/api/alarms/$alarmId/acknowledge" -Method Post -TimeoutSec 5
            if (-not $acknowledged.ok) { throw "Alarm acknowledgement API returned failure" }
            $activeAfterAck = @(Invoke-RestMethod "http://127.0.0.1:5081/api/alarms/active" -TimeoutSec 5 | Where-Object { $null -ne $_ -and -not [string]::IsNullOrWhiteSpace($_.alarmId) })
            $acknowledgedAlarm = $activeAfterAck | Where-Object { $_.alarmId -eq $alarmId } | Select-Object -First 1
            if (-not $acknowledgedAlarm -or -not $acknowledgedAlarm.acknowledged -or -not $acknowledgedAlarm.acknowledgedAt) { throw "Alarm acknowledgement state/time was not recorded" }
            $recoverBody = @{ value = 55; requestId = "ci-alarm-recover" } | ConvertTo-Json
            $recoverWrite = Invoke-RestMethod -Uri "http://127.0.0.1:5081/api/variables/line.targetSpeed/write" -Method Post -ContentType "application/json" -Body $recoverBody -TimeoutSec 5
            if (-not $recoverWrite.ok) { throw "HMIStudio alarm recovery variable write failed" }
            $alarmHistory = @()
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Seconds 1
              $alarmHistory = @(Invoke-RestMethod "http://127.0.0.1:5081/api/alarms/history?limit=20" -TimeoutSec 5)
              $eventTypes = @($alarmHistory | ForEach-Object { $_.eventType })
              if ($eventTypes -contains "Triggered" -and $eventTypes -contains "Acknowledged" -and $eventTypes -contains "Recovered") { break }
            }
            if ($eventTypes -notcontains "Triggered" -or $eventTypes -notcontains "Acknowledged" -or $eventTypes -notcontains "Recovered") { throw "Alarm history is missing trigger, acknowledgement, or recovery events" }
            $activeAfterRecovery = @(Invoke-RestMethod "http://127.0.0.1:5081/api/alarms/active" -TimeoutSec 5 | Where-Object { $null -ne $_ -and -not [string]::IsNullOrWhiteSpace($_.alarmId) })
            if ($activeAfterRecovery.Count -ne 0) { throw "Recovered alarm remains active: $(ConvertTo-Json -InputObject $activeAfterRecovery -Depth 5 -Compress)" }
            $invalidScreen = $screen | ConvertTo-Json -Depth 50 | ConvertFrom-Json
            $invalidRunToggle = $invalidScreen.controls | Where-Object { $_.id -eq "run-toggle" } | Select-Object -First 1
            if (-not $invalidRunToggle) { throw "HMIStudio demo screen has no run-toggle button for write validation" }
            $invalidRunToggle.properties.writeVarId.source.value = "line.targetSpeed"
            $invalidBody = $invalidScreen | ConvertTo-Json -Depth 50
            $invalidWriteRejected = $false
            try {
              Invoke-RestMethod -Uri "http://127.0.0.1:5081/api/screens/main" -Method Put -ContentType "application/json" -Body $invalidBody -TimeoutSec 5 | Out-Null
            } catch {
              if ($_.Exception.Response.StatusCode.value__ -eq 400) { $invalidWriteRejected = $true }
            }
            if (-not $invalidWriteRejected) { throw "HMIStudio accepted a toggle write binding for a numeric variable" }
            $invalidInputScreen = Invoke-RestMethod "http://127.0.0.1:5081/api/screens/main" -TimeoutSec 5
            $invalidTargetInput = $invalidInputScreen.controls | Where-Object { $_.id -eq "target-speed-input" } | Select-Object -First 1
            if (-not $invalidTargetInput) { throw "HMIStudio demo screen has no numeric input for binding validation" }
            $invalidTargetInput.properties.text.source.varId = "line.running"
            $invalidInputBody = $invalidInputScreen | ConvertTo-Json -Depth 50
            $invalidNumericInputRejected = $false
            try {
              Invoke-RestMethod -Uri "http://127.0.0.1:5081/api/screens/main" -Method Put -ContentType "application/json" -Body $invalidInputBody -TimeoutSec 5 | Out-Null
            } catch {
              if ($_.Exception.Response.StatusCode.value__ -eq 400) { $invalidNumericInputRejected = $true }
            }
            if (-not $invalidNumericInputRejected) { throw "HMIStudio accepted a boolean variable for a numeric input control" }
            $readonlyInputScreen = Invoke-RestMethod "http://127.0.0.1:5081/api/screens/main" -TimeoutSec 5
            $readonlyTargetInput = $readonlyInputScreen.controls | Where-Object { $_.id -eq "target-speed-input" } | Select-Object -First 1
            if (-not $readonlyTargetInput) { throw "HMIStudio demo screen has no numeric input for readonly binding validation" }
            $readonlyTargetInput.properties.text.source.varId = "line.speed"
            $readonlyInputBody = $readonlyInputScreen | ConvertTo-Json -Depth 50
            $readonlyNumericInputRejected = $false
            try {
              Invoke-RestMethod -Uri "http://127.0.0.1:5081/api/screens/main" -Method Put -ContentType "application/json" -Body $readonlyInputBody -TimeoutSec 5 | Out-Null
            } catch {
              if ($_.Exception.Response.StatusCode.value__ -eq 400) { $readonlyNumericInputRejected = $true }
            }
            if (-not $readonlyNumericInputRejected) { throw "HMIStudio accepted a readonly variable for a numeric input control" }
            $screen = Invoke-RestMethod "http://127.0.0.1:5081/api/screens/main" -TimeoutSec 5
            if ($screen.title -eq "CI save validation") { throw "Rejected invalid write binding unexpectedly changed the persisted screen" }
            $screen.title = "CI save validation"
            $body = $screen | ConvertTo-Json -Depth 50
            $saved = Invoke-RestMethod -Uri "http://127.0.0.1:5081/api/screens/main" -Method Put -ContentType "application/json" -Body $body -TimeoutSec 5
            if (-not $saved.ok) { throw "HMIStudio screen save API returned failure" }
            $screenAfter = Invoke-RestMethod "http://127.0.0.1:5081/api/screens/main" -TimeoutSec 5
            if ($screenAfter.title -ne "CI save validation") { throw "HMIStudio screen save was not persisted" }
            & taskkill /PID $server.Id /T /F | Out-Null
            $server.WaitForExit(10000) | Out-Null
            Start-Sleep -Seconds 2
            $server = Start-Process dotnet -ArgumentList @("run", "--no-build", "--project", "src/HMI.Server", "--configuration", "Release") -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\hmistudio-server-restart.log" -RedirectStandardError "$env:RUNNER_TEMP\hmistudio-server-restart-error.log"
            $healthAfterRestart = $null
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 2
              try {
                $healthAfterRestart = Invoke-RestMethod "http://127.0.0.1:5081/api/health" -TimeoutSec 3
                break
              } catch {
                if ($server.HasExited) { break }
              }
            }
            if ($null -eq $healthAfterRestart -or $healthAfterRestart.status -ne "ok") {
              Get-Content "$env:RUNNER_TEMP\hmistudio-server-restart.log" -ErrorAction SilentlyContinue
              Get-Content "$env:RUNNER_TEMP\hmistudio-server-restart-error.log" -ErrorAction SilentlyContinue
              throw "HMIStudio runtime did not restart after persistence test"
            }
            $screenAfterRestart = Invoke-RestMethod "http://127.0.0.1:5081/api/screens/main" -TimeoutSec 5
            if ($screenAfterRestart.title -ne "CI save validation") { throw "HMIStudio screen changes did not survive runtime restart" }
            $historyAfterRestart = @(Invoke-RestMethod "http://127.0.0.1:5081/api/alarms/history?limit=20" -TimeoutSec 5)
            $restartEventTypes = @($historyAfterRestart | ForEach-Object { $_.eventType })
            if ($restartEventTypes -notcontains "Triggered" -or $restartEventTypes -notcontains "Acknowledged" -or $restartEventTypes -notcontains "Recovered") { throw "Alarm history did not survive runtime restart" }
            Write-Host "Runtime API ready; variable count: $($variables.Count); variable write verified; screen save survived restart"
          } finally {
            if (-not $server.HasExited) { & taskkill /PID $server.Id /T /F | Out-Null }
          }

      - name: Publish portable Windows x64 package
        shell: pwsh
        run: .\Publish-HMIStudio-Windows.ps1
      - name: Smoke test self-contained Windows package
        shell: pwsh
        run: |
          $publishPath = Join-Path $PWD "artifacts/HMIStudio-win-x64"
          $exe = Join-Path $publishPath "HMI.Server.exe"
          if (-not (Test-Path $exe)) { throw "Self-contained executable was not published" }
          if (-not (Test-Path (Join-Path $publishPath "wwwroot/index.html"))) { throw "Published frontend assets are missing" }
          $env:HMISTUDIO_URLS = "http://127.0.0.1:5082"
          $server = Start-Process -FilePath $exe -WorkingDirectory $publishPath -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\hmistudio-published.log" -RedirectStandardError "$env:RUNNER_TEMP\hmistudio-published-error.log"
          try {
            $health = $null
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Seconds 1
              try { $health = Invoke-RestMethod "http://127.0.0.1:5082/api/health" -TimeoutSec 2; if ($health.status -eq "ok") { break } } catch {}
              if ($server.HasExited) { break }
            }
            if ($null -eq $health -or $health.status -ne "ok") {
              Get-Content "$env:RUNNER_TEMP\hmistudio-published.log" -ErrorAction SilentlyContinue
              Get-Content "$env:RUNNER_TEMP\hmistudio-published-error.log" -ErrorAction SilentlyContinue
              throw "Self-contained Windows package failed health check"
            }
            $page = Invoke-WebRequest "http://127.0.0.1:5082/" -TimeoutSec 5
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch "HMIStudio") { throw "Published frontend did not serve successfully" }
            $variables = @(Invoke-RestMethod "http://127.0.0.1:5082/api/variables" -TimeoutSec 5)
            if ($variables.Count -lt 1) { throw "Published runtime returned no variables" }
            Write-Host "Self-contained package passed health, frontend, and variable API smoke tests"
          } finally {
            if (-not $server.HasExited) { & taskkill /PID $server.Id /T /F | Out-Null }
          }

      - name: Upload portable Windows x64 package
        uses: actions/upload-artifact@v4
        with:
          name: HMIStudio-win-x64
          path: artifacts/HMIStudio-win-x64.zip
