name: .NET 10 build

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore HMIStudio.sln
      - name: Build
        run: dotnet build HMIStudio.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test HMIStudio.sln --configuration Release --no-build --no-restore
